<path d="M 540 110 L 552 122 L 540 134 L 528 122 Z" fill="#b23b2e"/>
<text x="540" y="194" text-anchor="middle" font-size="62" font-weight="700" fill="#2e2620" letter-spacing="8">历史上的今天</text>
<text x="540" y="232" text-anchor="middle" font-size="19" fill="#8a6a3a" letter-spacing="6">ON THIS DAY IN HISTORY</text>
<text x="540" y="332" text-anchor="middle" font-size="84" font-weight="700" fill="#9e2b25" letter-spacing="4">9 月 13 日</text>
<line x1="470" y1="360" x2="610" y2="360" stroke="#b23b2e" stroke-width="3"/>
<g transform="rotate(-8 938 160)"><rect x="890" y="112" width="96" height="96" rx="10" fill="#b23b2e" opacity="0.92"/><rect x="896" y="118" width="84" height="84" rx="6" fill="none" stroke="#f3e9d2" stroke-width="2"/><text x="938" y="180" text-anchor="middle" font-size="56" font-weight="700" fill="#f7efdd">史</text></g>
<line x1="104" y1="404" x2="976" y2="404" stroke="#a9814f" stroke-width="1.5"/>
<line x1="104" y1="409" x2="976" y2="409" stroke="#a9814f" stroke-width="0.8" opacity="0.6"/>
<rect x="114" y="450" width="34" height="34" rx="5" fill="#b23b2e"/><text x="131" y="473" text-anchor="middle" font-size="20" font-weight="700" fill="#f7efdd">日</text><text x="164" y="474" font-size="30" font-weight="700" fill="#b23b2e" letter-spacing="3">今日焦点</text>
<rect x="114" y="520" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1993</text>
<text x="220" y="550" font-size="29" fill="#2e2620">以色列總理伊扎克·拉賓和巴勒斯坦解放組織主席阿拉法</text>
<text x="220" y="588" font-size="29" fill="#2e2620">特在美國總統克林顿的見證下於白宫正式签署《奧斯陸協</text>
<text x="220" y="626" font-size="29" fill="#2e2620">議》，巴勒斯坦根据协议获得有限自治。</text>
<rect x="114" y="664" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="717" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1987</text>
<text x="220" y="694" font-size="29" fill="#2e2620">巴西戈亞尼亞发生核安全事故，拾荒者盜拆并贩卖診所遺</text>
<text x="220" y="732" font-size="29" fill="#2e2620">留的放射治療器械，造成內藏的放射性物質擴散並污染全</text>
<text x="220" y="770" font-size="29" fill="#2e2620">市。</text>
<rect x="114" y="808" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="861" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1971</text>
<text x="220" y="838" font-size="29" fill="#2e2620">中共中央副主席林彪在五七一工程的政变图谋东窗事发后</text>
<text x="220" y="876" font-size="29" fill="#2e2620">潜逃出国，其搭乘的专机于蒙古人民共和國温都尔汗附近</text>
<text x="220" y="914" font-size="29" fill="#2e2620">墜毀，本人及随行家人全部死亡。</text>
<rect x="114" y="946" width="34" height="34" rx="5" fill="#34516b"/><text x="131" y="969" text-anchor="middle" font-size="20" font-weight="700" fill="#f7efdd">日</text><text x="164" y="970" font-size="30" font-weight="700" fill="#34516b" letter-spacing="3">更多往事</text>
<circle cx="122" cy="1008" r="4" fill="#a9814f"/><text x="142" y="1016" font-size="25" fill="#5a4a3a">-509　古羅馬的朱庇特神廟完工。</text>
<circle cx="122" cy="1052" r="4" fill="#a9814f"/><text x="142" y="1060" font-size="25" fill="#5a4a3a">122　罗马帝国开始建造哈德良长城。</text>
<circle cx="122" cy="1096" r="4" fill="#a9814f"/><text x="142" y="1104" font-size="25" fill="#5a4a3a">533　贝利撒留率领的罗马军团在阿德底斯姆战役中击…</text>
<circle cx="122" cy="1140" r="4" fill="#a9814f"/><text x="142" y="1148" font-size="25" fill="#5a4a3a">728　唐朝颁行《大衍历》。</text>
<circle cx="122" cy="1184" r="4" fill="#a9814f"/><text x="142" y="1192" font-size="25" fill="#5a4a3a">1229　窝阔台登基，成为蒙古帝国大汗。</text>
<line x1="104" y1="1308" x2="976" y2="1308" stroke="#a9814f" stroke-width="1" opacity="0.7"/>
