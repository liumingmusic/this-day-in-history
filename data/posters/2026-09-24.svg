<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">2015</text>
<text x="220" y="550" font-size="29" fill="#2e2620">麥加朝覲者在“掷石拒魔”儀式上發生嚴重踩踏事故，造</text>
