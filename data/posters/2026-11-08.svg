<text x="220" y="550" font-size="29" fill="#2e2620">共和党参选人唐纳德·特朗普在总统选举中击败民主党参</text>
<text x="220" y="588" font-size="29" fill="#2e2620">选人希拉里·克林顿胜出，成为美国史上唯一未曾擔任政</text>
