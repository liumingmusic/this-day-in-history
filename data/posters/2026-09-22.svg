<rect x="114" y="520" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1985</text>
<text x="220" y="550" font-size="29" fill="#2e2620">美國、日本、英國、法國及西德的財政代表於美國紐約的</text>
<text x="220" y="588" font-size="29" fill="#2e2620">廣場飯店會晤後簽署《廣場協議》。</text>
<rect x="114" y="628" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="681" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1980</text>
<text x="220" y="658" font-size="29" fill="#2e2620">伊拉克總統萨达姆·侯赛因下令針對伊朗空軍基地發動空</text>
<text x="220" y="696" font-size="29" fill="#2e2620">襲行動，兩伊戰爭爆發。</text>
<rect x="114" y="736" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="789" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1919</text>
<text x="220" y="766" font-size="29" fill="#2e2620">威廉·Z·福斯特領導逾36萬名美國鋼鐵員工發動罷工</text>
<text x="220" y="804" font-size="29" fill="#2e2620">（圖），要求實現8小時工作制、每週工作六天並改善勞</text>
<text x="220" y="842" font-size="29" fill="#2e2620">工待遇。</text>
<rect x="114" y="874" width="34" height="34" rx="5" fill="#34516b"/><text x="131" y="897" text-anchor="middle" font-size="20" font-weight="700" fill="#f7efdd">日</text><text x="164" y="898" font-size="30" font-weight="700" fill="#34516b" letter-spacing="3">更多往事</text>
<circle cx="122" cy="936" r="4" fill="#a9814f"/><text x="142" y="944" font-size="25" fill="#5a4a3a">189　宦官诛何进，东汉外戚专权结束。</text>
<circle cx="122" cy="980" r="4" fill="#a9814f"/><text x="142" y="988" font-size="25" fill="#5a4a3a">904　宣武軍節度使朱溫指使他人殺害唐朝第十九位皇…</text>
<circle cx="122" cy="1024" r="4" fill="#a9814f"/><text x="142" y="1032" font-size="25" fill="#5a4a3a">1236　波罗的海沿岸地區的薩莫吉西亞人、瑟米加利亞…</text>
<circle cx="122" cy="1068" r="4" fill="#a9814f"/><text x="142" y="1076" font-size="25" fill="#5a4a3a">1236　立窩尼亞十字軍入侵：寶劍騎士團在蘇勒戰役中…</text>
<circle cx="122" cy="1112" r="4" fill="#a9814f"/><text x="142" y="1120" font-size="25" fill="#5a4a3a">1499　瑞士独立。</text>
