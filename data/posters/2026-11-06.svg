<circle cx="122" cy="988" r="4" fill="#a9814f"/><text x="142" y="996" font-size="25" fill="#5a4a3a">1600　在关原之战中战败的西军大名石田三成、小西行…</text>
<circle cx="122" cy="1032" r="4" fill="#a9814f"/><text x="142" y="1040" font-size="25" fill="#5a4a3a">1792　法国大革命战争中，法国于热马普战役中大败神…</text>
