<circle cx="122" cy="936" r="4" fill="#a9814f"/><text x="142" y="944" font-size="25" fill="#5a4a3a">1086　西夏崇宗李乾順建天儀治平年號。</text>
<circle cx="122" cy="980" r="4" fill="#a9814f"/><text x="142" y="988" font-size="25" fill="#5a4a3a">1176　密列奧塞法隆戰役爆發，拜占庭帝國敗於塞爾柱…</text>
<circle cx="122" cy="1024" r="4" fill="#a9814f"/><text x="142" y="1032" font-size="25" fill="#5a4a3a">1382　拉約什一世死後，他的女兒瑪麗亞在沒有男性繼…</text>
<circle cx="122" cy="1068" r="4" fill="#a9814f"/><text x="142" y="1076" font-size="25" fill="#5a4a3a">1567　日本大名織田信長從齋藤龍興手上奪取稻葉山城…</text>
<circle cx="122" cy="1112" r="4" fill="#a9814f"/><text x="142" y="1120" font-size="25" fill="#5a4a3a">1630　來自英國的清教徒在马萨诸塞湾殖民地建立波士…</text>
