<rect x="114" y="520" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">2017</text>
<text x="220" y="550" font-size="29" fill="#2e2620">在独立公投后，加泰罗尼亚单方面宣布脱离西班牙独立建</text>
<text x="220" y="588" font-size="29" fill="#2e2620">国。西班牙政府指行为违宪，并根据《西班牙宪法》15</text>
<text x="220" y="626" font-size="29" fill="#2e2620">5条接管加泰罗尼亚、冻结自治权。</text>
<rect x="114" y="664" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="717" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1961</text>
<text x="220" y="694" font-size="29" fill="#2e2620">美國國家航空暨太空總署為進入地心軌道研製的土星1号</text>
<text x="220" y="732" font-size="29" fill="#2e2620">运载火箭首次在卡纳维拉尔角發射升空。</text>
<rect x="114" y="772" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="825" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1930</text>
<text x="220" y="802" font-size="29" fill="#2e2620">臺灣賽德克族頭目莫那·魯道（圖）聯合各個部落在霧社</text>
<text x="220" y="840" font-size="29" fill="#2e2620">公學校等地襲擊日本人，為日治時期臺灣最後一次武裝抗</text>
<text x="220" y="878" font-size="29" fill="#2e2620">日事件。</text>
<rect x="114" y="910" width="34" height="34" rx="5" fill="#34516b"/><text x="131" y="933" text-anchor="middle" font-size="20" font-weight="700" fill="#f7efdd">日</text><text x="164" y="934" font-size="30" font-weight="700" fill="#34516b" letter-spacing="3">更多往事</text>
<circle cx="122" cy="972" r="4" fill="#a9814f"/><text x="142" y="980" font-size="25" fill="#5a4a3a">312　听闻君士坦丁大帝曾看到著名的十字架。</text>
<circle cx="122" cy="1016" r="4" fill="#a9814f"/><text x="142" y="1024" font-size="25" fill="#5a4a3a">710　撒拉森人入侵位在義大利半島西側第勒尼安海上…</text>
<circle cx="122" cy="1060" r="4" fill="#a9814f"/><text x="142" y="1068" font-size="25" fill="#5a4a3a">939　威塞克斯王國及英格蘭王國國王埃塞爾斯坦去世…</text>
<circle cx="122" cy="1104" r="4" fill="#a9814f"/><text x="142" y="1112" font-size="25" fill="#5a4a3a">1275　在有關免除阿姆斯特爾河大壩通行費的文件中，…</text>
<circle cx="122" cy="1148" r="4" fill="#a9814f"/><text x="142" y="1156" font-size="25" fill="#5a4a3a">1524　意大利战争：法国军队围攻帕维亚。</text>
