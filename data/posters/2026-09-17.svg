<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">2011</text>
<text x="220" y="550" font-size="29" fill="#2e2620">近一千名示威者在美国宪法日進入紐約金融中心華爾街示</text>
<text x="220" y="588" font-size="29" fill="#2e2620">威，拉开了佔領華爾街运动的序幕。</text>
<rect x="114" y="628" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="681" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1978</text>
<text x="220" y="658" font-size="29" fill="#2e2620">埃及总统穆罕默德·安瓦爾·薩達特和以色列总理梅纳赫</text>
<text x="220" y="696" font-size="29" fill="#2e2620">姆·贝京在美国大衛營签订《戴维营协议》，隨後雙方握</text>
<text x="220" y="734" font-size="29" fill="#2e2620">手言和。</text>
<rect x="114" y="772" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="825" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1894</text>
<text x="220" y="802" font-size="29" fill="#2e2620">大日本帝國海軍在西朝鲜湾發生的黃海海戰擊敗清朝北洋</text>
<text x="220" y="840" font-size="29" fill="#2e2620">水師，取得甲午戰爭制海權。</text>
