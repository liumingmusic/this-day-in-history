<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1983</text>
<text x="220" y="550" font-size="29" fill="#2e2620">苏联卫星错误地偵測到5枚美國飛彈来袭，苏联軍官斯坦</text>
<text x="220" y="588" font-size="29" fill="#2e2620">尼斯拉夫·彼得羅夫没有上报系统警报，避免了冷战演变</text>
<text x="220" y="626" font-size="29" fill="#2e2620">为核战争。</text>
