<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1975</text>
<text x="220" y="550" font-size="29" fill="#2e2620">摩洛哥政府號召35萬民眾越過與西撒哈拉的分界線，要</text>
