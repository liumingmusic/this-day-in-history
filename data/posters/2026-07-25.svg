<circle cx="122" cy="900" r="4" fill="#a9814f"/><text x="142" y="908" font-size="25" fill="#5a4a3a">306　罗马帝国西部的奥古斯都君士坦提乌斯一世去世…</text>
<circle cx="122" cy="944" r="4" fill="#a9814f"/><text x="142" y="952" font-size="25" fill="#5a4a3a">315　为了纪念米尔维安大桥战役的胜利，君士坦丁一…</text>
<circle cx="122" cy="988" r="4" fill="#a9814f"/><text x="142" y="996" font-size="25" fill="#5a4a3a">864　秃头查理下令建立抵御维京人的防御措施。</text>
<circle cx="122" cy="1032" r="4" fill="#a9814f"/><text x="142" y="1040" font-size="25" fill="#5a4a3a">1137　亞奎丹的艾莉諾與後來成為法國國王的路易王子…</text>
<circle cx="122" cy="1076" r="4" fill="#a9814f"/><text x="142" y="1084" font-size="25" fill="#5a4a3a">1139　阿風索一世率領軍隊在奧里基戰役中擊敗穆拉比…</text>
