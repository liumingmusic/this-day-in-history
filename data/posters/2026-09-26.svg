<text x="153" y="717" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1959</text>
<text x="220" y="694" font-size="29" fill="#2e2620">超强台风维娜登陸日本近畿地方，造成超過5,000人</text>
<text x="220" y="732" font-size="29" fill="#2e2620">死亡、160万人无家可归，成为日本历史上傷亡最慘重</text>
