<text x="153" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">2000</text>
<text x="220" y="550" font-size="29" fill="#2e2620">法國航空4590號班機在巴黎夏爾·戴高樂機場起飛後</text>
<text x="220" y="588" font-size="29" fill="#2e2620">不久墜毀，造成機上113人死亡。</text>
<rect x="114" y="628" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="681" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1957</text>
<text x="220" y="658" font-size="29" fill="#2e2620">突尼斯推翻侯赛因王朝君主制並建立共和國，哈比卜·布</text>
<text x="220" y="696" font-size="29" fill="#2e2620">爾吉巴（圖）擔任首任總統。</text>
<rect x="114" y="736" width="78" height="78" rx="8" fill="#b23b2e"/>
<text x="153" y="789" text-anchor="middle" font-size="30" font-weight="700" fill="#f7efdd">1943</text>
<text x="220" y="766" font-size="29" fill="#2e2620">意大利法西斯大委員會解除贝尼托·墨索里尼的政府職務</text>
<text x="220" y="804" font-size="29" fill="#2e2620">，由佩特羅·巴多格里奧繼任首相。</text>
